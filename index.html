<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Pallabi Demo Table</title>
  <style>
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 6px; }
    input { width: 60px; }
  </style>
</head>
<body>
  <h2>Pallabi Demo – Processing Orders</h2>

  <table>
    <thead>
      <tr>
        <th>Consignment Id</th>
        <th>Weight</th>
        <th>Target Hub</th>
        <th>Merchant Order Id</th>
        <th>Recipient Address</th>
        <th>Price</th>
        <th>Merchant</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>DA1001ABC</td>
        <td><input type="number" value="0.5" step="0.5"></td>
        <td>Pallabi</td>
        <td>ORD-111</td>
        <td>Dhaka</td>
        <td>850</td>
        <td>Fashionking.com</td>
        <td>INCOMPLETE</td>
      </tr>
      <tr>
        <td>DA1002DEF</td>
        <td><input type="number" value="1.0" step="0.5"></td>
        <td>Pallabi</td>
        <td>ORD-112</td>
        <td>Dhaka</td>
        <td>900</td>
        <td>ShopX</td>
        <td>INCOMPLETE</td>
      </tr>
    </tbody>
  </table>

  <!-- Header এ pseudo user দেখানোর জন্য -->
  <div class="topbar-user" style="position: fixed; top: 5px; right: 10px; background:#eee; padding:5px;">
    Miraj Sabbir - Associate (demo@pathao.com)
  </div>
</body>
</html>
